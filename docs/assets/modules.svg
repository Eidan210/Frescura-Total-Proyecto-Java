<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t d">
  <title id="t">Módulos del ERP</title>
  <desc id="d">Cuatro módulos: Inventario, Ventas, Proveedores y Logística, con sus funciones principales</desc>
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .card { fill: #ffffff; stroke: #d1d5db; }
    .name { fill: #111827; font-size: 22px; font-weight: 700; }
    .item { fill: #4b5563; font-size: 15px; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #161b22; stroke: #30363d; }
      .name { fill: #f0f6fc; }
      .item { fill: #9ca3af; }
    }
  </style>

  <g transform="translate(4 4)">
    <rect class="card" width="232" height="292" rx="14"/>
    <path d="M14 0 H218 A14 14 0 0 1 232 14 V18 H0 V14 A14 14 0 0 1 14 0 Z" fill="#059669"/>
    <circle cx="44" cy="62" r="22" fill="#059669"/>
    <path d="M33 56 L44 50 L55 56 V70 H33 Z M33 56 L44 62 L55 56 M44 62 V70" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
    <text class="name" x="76" y="70">Inventario</text>
    <g class="item">
      <text x="24" y="120">Lotes y recepción</text>
      <text x="24" y="148">Salida FEFO</text>
      <text x="24" y="176">Cuarentena e inspección</text>
      <text x="24" y="204">Registro de mermas</text>
      <text x="24" y="232">Control de vencimiento</text>
      <text x="24" y="260">Trazabilidad de lotes</text>
    </g>
  </g>

  <g transform="translate(256 4)">
    <rect class="card" width="232" height="292" rx="14"/>
    <path d="M14 0 H218 A14 14 0 0 1 232 14 V18 H0 V14 A14 14 0 0 1 14 0 Z" fill="#7c3aed"/>
    <circle cx="44" cy="62" r="22" fill="#7c3aed"/>
    <path d="M35 49 H53 V75 L49 72 L44 75 L39 72 L35 75 Z M39 57 H49 M39 63 H49" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <text class="name" x="76" y="70">Ventas</text>
    <g class="item">
      <text x="24" y="120">Registro de clientes</text>
      <text x="24" y="148">Nuevas ventas</text>
      <text x="24" y="176">Envío a preparación</text>
      <text x="24" y="204">Factura en PNG</text>
      <text x="24" y="232">CUFE simulado y QR</text>
      <text x="24" y="260">Descuento por vencimiento</text>
    </g>
  </g>

  <g transform="translate(508 4)">
    <rect class="card" width="232" height="292" rx="14"/>
    <path d="M14 0 H218 A14 14 0 0 1 232 14 V18 H0 V14 A14 14 0 0 1 14 0 Z" fill="#d97706"/>
    <circle cx="44" cy="62" r="22" fill="#d97706"/>
    <path d="M32 74 V60 L40 54 V60 L48 54 V60 L56 54 V74 Z" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
    <text class="name" x="76" y="70">Proveedores</text>
    <g class="item">
      <text x="24" y="120">Registrar proveedor</text>
      <text x="24" y="148">Listar y buscar por ID</text>
      <text x="24" y="176">Actualizar datos</text>
      <text x="24" y="204">Eliminar proveedor</text>
    </g>
  </g>

  <g transform="translate(760 4)">
    <rect class="card" width="232" height="292" rx="14"/>
    <path d="M14 0 H218 A14 14 0 0 1 232 14 V18 H0 V14 A14 14 0 0 1 14 0 Z" fill="#0284c7"/>
    <circle cx="44" cy="62" r="22" fill="#0284c7"/>
    <path d="M31 54 H47 V70 H31 Z M47 59 H53 L57 64 V70 H47" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="37" cy="71" r="2.6" fill="#ffffff"/>
    <circle cx="51" cy="71" r="2.6" fill="#ffffff"/>
    <text class="name" x="76" y="70">Logística</text>
    <g class="item">
      <text x="24" y="120">Panel de despacho</text>
      <text x="24" y="148">Rutas de entrega</text>
      <text x="24" y="176">Marcar ventas entregadas</text>
      <text x="24" y="204">Vehículos</text>
      <text x="24" y="232">Conductores</text>
    </g>
  </g>
